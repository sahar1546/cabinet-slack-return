<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to Cabinet</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#faf6f1; color:#3b2f2f;
         font:16px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width:28rem; padding:24px; text-align:center; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { margin:0; color:#8b7355; }
</style>
</head>
<body>
<main>
  <h1 id="title">Going back to Cabinet...</h1>
  <p id="line">One moment.</p>
</main>
<script>
// Temporary return page for Cabinet's Slack sign-in on a computer. Slack only returns to an
// https address, so it lands here and this page hands the code straight to the Cabinet
// waiting on this same computer. The port travels in Slack's state as "p<port>.<random>".
// It only ever forwards to 127.0.0.1, and it never keeps or sends the code anywhere else.
(function () {
  var q = new URLSearchParams(location.search);
  var state = q.get("state") || "";
  var m = /^p(\d{4,5})\.[A-Za-z0-9_-]{20,}$/.exec(state);
  var port = m ? Number(m[1]) : 0;
  if (!m || port < 1024 || port > 65535) {
    document.getElementById("title").textContent = "This link doesn't belong to Cabinet.";
    document.getElementById("line").textContent = "Go back to Cabinet and press Connect Slack again.";
    return;
  }
  var out = new URLSearchParams();
  ["code", "state", "error"].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
  history.replaceState(null, "", location.pathname);
  location.replace("http://127.0.0.1:" + port + "/callback?" + out.toString());
  setTimeout(function () {
    document.getElementById("title").textContent = "Couldn't reach Cabinet.";
    document.getElementById("line").textContent = "Make sure Cabinet is open on this computer, then press Connect Slack again.";
  }, 4000);
})();
</script>
</body>
</html>
